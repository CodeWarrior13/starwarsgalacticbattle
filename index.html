<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galactic Card Battles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=Chakra+Petch:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="starfield" aria-hidden="true"></div>

  <header class="topbar">
    <button class="brand" type="button" data-nav="home" aria-label="Home">
      <span class="brand-top">STAR WARS</span>
      <span class="brand-bottom">Galactic Card Battles</span>
    </button>
    <nav class="main-nav" aria-label="Main">
      <button type="button" data-nav="home"><span class="nav-ico" data-nav-ico="planet"></span><span class="nav-lbl">Galaxy</span></button>
      <button type="button" data-nav="collection"><span class="nav-ico" data-nav-ico="sabacc"></span><span class="nav-lbl">Collection</span></button>
      <button type="button" data-nav="market"><span class="nav-ico" data-nav-ico="crate"></span><span class="nav-lbl">Black Market</span></button>
      <i class="nav-saber" aria-hidden="true"></i>
    </nav>
    <button class="account" type="button" data-profile title="Commander profile" aria-live="polite">
      <span class="acct-lv">LV <b id="acct-level">1</b></span>
      <span class="acct-bar"><i id="acct-bar"></i></span>
    </button>
    <button class="icon-btn settings-btn" type="button" data-settings aria-label="Settings" title="Settings"></button>
    <div class="wallet" aria-live="polite">
      <span class="currency credits" title="Galactic Credits"><i data-icon="credits"></i><b id="credits">0</b></span>
      <span class="currency crystals" title="Kyber Crystals"><i data-icon="crystals"></i><b id="crystals">0</b></span>
      <span class="currency aurodium" title="Aurodium Ingots (from bosses)"><i data-icon="aurodium"></i><b id="aurodium">0</b></span>
    </div>
  </header>

  <main id="screen" class="screen"></main>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="js/audio.js"></script>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/art-images.js"></script>
  <script src="js/art.js"></script>
  <script src="js/env.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/battle-ui.js"></script>
  <script src="js/ults.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
