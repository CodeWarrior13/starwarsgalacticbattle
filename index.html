<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="todo-card" aria-labelledby="app-title">
      <header class="app-header">
        <p class="eyebrow">Stay organized</p>
        <h1 id="app-title">My To-Do List</h1>
        <p class="subtitle">Plan your day, one task at a time.</p>
      </header>

      <form id="todo-form" class="todo-form">
        <label class="sr-only" for="todo-input">Add a task</label>
        <input id="todo-input" name="task" type="text" placeholder="What needs to be done?" maxlength="120" autocomplete="off" required />
        <button type="submit">Add task</button>
      </form>

      <div class="toolbar">
        <p id="task-count" class="task-count" aria-live="polite">0 tasks left</p>
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter-button active" type="button" data-filter="all">All</button>
          <button class="filter-button" type="button" data-filter="active">Active</button>
          <button class="filter-button" type="button" data-filter="completed">Completed</button>
        </div>
      </div>

      <ul id="todo-list" class="todo-list" aria-label="Tasks"></ul>
      <p id="empty-state" class="empty-state">No tasks yet. Add one above to get started.</p>

      <footer class="app-footer">
        <button id="clear-completed" class="text-button" type="button">Clear completed</button>
        <button id="clear-all" class="text-button danger" type="button">Clear all</button>
      </footer>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
